<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 290">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#AC92EE"/><stop offset="1" stop-color="#7A63C6"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3E3057"/><stop offset="1" stop-color="#291E3D"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="120" cy="270" rx="64" ry="11" fill="#0d0a1d" opacity=".5"/>

  <!-- halo + sparkles -->
  <circle cx="120" cy="96" r="84" fill="none" stroke="#CBB8FF" stroke-width="2.5" opacity=".5" filter="url(#glow)"/>
  <path d="M38 44l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z" fill="#F5C8DC" opacity=".9"/>
  <path d="M204 66l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#CBB8FF" opacity=".9"/>
  <path d="M28 156l1.8 4.4 4.4 1.8-4.4 1.8-1.8 4.4-1.8-4.4-4.4-1.8 4.4-1.8z" fill="#CBB8FF" opacity=".8"/>
  <path d="M206 176l2.2 5.4 5.4 2.2-5.4 2.2-2.2 5.4-2.2-5.4-5.4-2.2 5.4-2.2z" fill="#F5C8DC" opacity=".8"/>

  <!-- back hair -->
  <path d="M58 96 C54 40 88 14 120 14 C152 14 186 40 182 96 C181 128 170 148 154 156 L86 156 C70 148 59 128 58 96 Z" fill="url(#hair)"/>

  <!-- legs + shoes (sitting forward) -->
  <path d="M97 232 L92 258" stroke="#F6D4BB" stroke-width="16" stroke-linecap="round"/>
  <path d="M143 232 L148 258" stroke="#F6D4BB" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="89" cy="263" rx="13.5" ry="9" fill="#B7A6EA"/>
  <ellipse cx="151" cy="263" rx="13.5" ry="9" fill="#B7A6EA"/>
  <ellipse cx="89" cy="260" rx="13.5" ry="5" fill="#CBBCF2"/>
  <ellipse cx="151" cy="260" rx="13.5" ry="5" fill="#CBBCF2"/>

  <!-- dress -->
  <path d="M78 158 C64 190 60 216 58 238 C92 251 148 251 182 238 C180 216 176 190 162 158 C148 148 92 148 78 158 Z" fill="url(#dress)"/>
  <path d="M62 236 C94 248 146 248 178 236" fill="none" stroke="#E4D9FF" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <path d="M96 166 C90 190 88 212 90 234 M144 166 C150 190 152 212 150 234" fill="none" stroke="#E9DFFF" stroke-width="3" stroke-linecap="round" opacity=".45"/>
  <circle cx="120" cy="176" r="3.4" fill="#F6F1FF" opacity=".95"/>
  <circle cx="120" cy="192" r="3.4" fill="#F6F1FF" opacity=".95"/>

  <!-- arms + hands -->
  <path d="M84 168 C76 190 82 206 96 214" fill="none" stroke="#F6D4BB" stroke-width="13" stroke-linecap="round"/>
  <path d="M156 168 C164 190 158 206 144 214" fill="none" stroke="#F6D4BB" stroke-width="13" stroke-linecap="round"/>
  <circle cx="98" cy="216" r="9" fill="#F6D4BB"/>
  <circle cx="142" cy="216" r="9" fill="#F6D4BB"/>

  <!-- collar -->
  <ellipse cx="120" cy="153" rx="27" ry="10" fill="#F6F1FF"/>

  <!-- head -->
  <circle cx="120" cy="96" r="50" fill="#F6D4BB" stroke="#EBC0A6" stroke-width="3"/>

  <!-- side strands -->
  <path d="M71 92 C66 118 70 140 84 152 C78 128 78 110 83 92 Z" fill="url(#hair)"/>
  <path d="M169 92 C174 118 170 140 156 152 C162 128 162 110 157 92 Z" fill="url(#hair)"/>

  <!-- bangs -->
  <path d="M72 94 C69 46 96 27 120 27 C144 27 171 46 168 94 C158 72 146 62 132 66 C127 54 113 54 108 66 C94 62 82 72 72 94 Z" fill="url(#hair)"/>
  <!-- ahoge -->
  <path d="M119 28 C116 17 122 9 130 11 C123 14 121 20 122 28 Z" fill="url(#hair)"/>
  <path d="M150 42l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#E9DFFF" opacity=".85"/>

  <!-- eyes -->
  <ellipse cx="100" cy="100" rx="7.5" ry="10.5" fill="#241733"/>
  <ellipse cx="140" cy="100" rx="7.5" ry="10.5" fill="#241733"/>
  <circle cx="97.5" cy="96" r="2.8" fill="#fff"/>
  <circle cx="102.5" cy="105" r="1.3" fill="#fff" opacity=".9"/>
  <circle cx="137.5" cy="96" r="2.8" fill="#fff"/>
  <circle cx="142.5" cy="105" r="1.3" fill="#fff" opacity=".9"/>

  <!-- blush -->
  <ellipse cx="82" cy="114" rx="8.5" ry="5" fill="#F2A9BE" opacity=".75"/>
  <ellipse cx="158" cy="114" rx="8.5" ry="5" fill="#F2A9BE" opacity=".75"/>

  <!-- smile -->
  <path d="M111 118 Q120 127 129 118" fill="none" stroke="#C9707E" stroke-width="3.5" stroke-linecap="round"/>
</svg>
